spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cache:
    type: caffeine

  # Do NOT set spring.data.redis.host in tests – this causes RedisConfig to be
  # skipped (it's @ConditionalOnProperty) and FallbackCacheConfig provides
  # an in-memory redisCacheManager instead.

logging:
  level:
    com.example.springcaching: DEBUG
    org.springframework.cache: TRACE
    org.springframework.data.redis: WARN
