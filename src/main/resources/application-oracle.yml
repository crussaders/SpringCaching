# ─── Oracle profile ─────────────────────────────────────────────────────────
# Activate with: --spring.profiles.active=oracle
# Or set environment variable: SPRING_PROFILES_ACTIVE=oracle
# ─────────────────────────────────────────────────────────────────────────────

spring:
  datasource:
    url: jdbc:oracle:thin:@//${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}/${ORACLE_SERVICE:FREEPDB1}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${ORACLE_USER:caching_user}
    password: ${ORACLE_PASSWORD:Caching123}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

  flyway:
    locations: classpath:db/migration
    url: jdbc:oracle:thin:@//${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}/${ORACLE_SERVICE:FREEPDB1}
    user: ${ORACLE_USER:caching_user}
    password: ${ORACLE_PASSWORD:Caching123}

  h2:
    console:
      enabled: false
