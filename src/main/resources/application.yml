spring:
  application:
    name: spring-caching-demo

  # ─── Database (default profile → H2 in-memory) ─────────────────────────────
  datasource:
    url: jdbc:h2:mem:springcachingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: none         # Flyway manages the schema
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  # ─── Flyway ─────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ─── Redis ──────────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # password: ${REDIS_PASSWORD:}   # uncomment if Redis requires auth

  # ─── Cache ──────────────────────────────────────────────────────────────────
  cache:
    type: caffeine    # primary cache manager uses Caffeine

# ─── Actuator ──────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,caches,metrics
  endpoint:
    caches:
      enabled: true
    health:
      show-details: always

# ─── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    com.example.springcaching: DEBUG
    org.springframework.cache: TRACE   # shows every cache hit/miss
    org.springframework.data.redis: WARN

# ─── SpringDoc / Swagger ────────────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

server:
  port: 8080
